
name: Build PixelCut Aero APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelCut Aero APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract and verify uploaded ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/PixelCut_Aero_Android_v2.zip"
          DEST="$RUNNER_TEMP/pixelcut-source"
          PROJECT_DIR="$DEST/VideoEditorApp"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::ZIP file not found: PixelCut_Aero_Android_v2.zip"
            echo "Make sure the ZIP is uploaded to the main repository page."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ARCHIVE" -d "$DEST"

          if [[ ! -f "$PROJECT_DIR/settings.gradle" ||
                ! -f "$PROJECT_DIR/build.gradle" ||
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Android project files are missing from ZIP."
            find "$DEST" -maxdepth 4 -type f | sort | head -150
            exit 1
          fi

          if ! grep -q "com.android.application.*8.7.3" "$PROJECT_DIR/build.gradle"; then
            echo "::error::Expected Android Gradle Plugin 8.7.3 was not found."
            cat "$PROJECT_DIR/build.gradle"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "ZIP extracted and Android project verified."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCut-Aero-APK
          path: ${{ runner.temp }}/pixelcut-source/VideoEditorApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
